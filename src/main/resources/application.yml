spring:
  application:
    name: crud
  datasource:
    url: jdbc:h2:file:./data/testdb
    username: "sa"
    password: "pass"
    #driver-class-name: org.h2.Driver
    driverClassName: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      poolName: "CrudExampleHikariPool"

  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false # Disables the Open Session in View pattern to prevent database queries during view rendering, ensuring better separation of concerns and avoiding potential performance issues.
    show-sql: true
    hibernate:
      ddl-auto: update # Hibernate ddl auto (create, create-drop, validate, update, none)
  mustache:
    check-template-location: false
